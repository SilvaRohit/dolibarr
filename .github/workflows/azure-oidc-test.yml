name: Azure OIDC and Registry Login Test

on:
  push:
    branches:
      - azure-terraform
    paths:
      - '.github/workflows/azure-oidc-test.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: |
          az acr login --name dolibaracr2026 --output none
          echo "Registry login completed"
