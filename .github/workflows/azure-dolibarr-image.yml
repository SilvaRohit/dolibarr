name: Azure Dolibarr Image CI

on:
  push:
    branches:
      - azure-terraform
    paths:
      - 'dolibarr-tls-image/**'
      - '.github/workflows/azure-dolibarr-image.yml'
  pull_request:
    branches:
      - azure-terraform
    paths:
      - 'dolibarr-tls-image/**'
      - '.github/workflows/azure-dolibarr-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Dolibarr TLS image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag dolibarr-tls:ci \
            ./dolibarr-tls-image

      - name: Check patched PHP file
        run: |
          docker run --rm \
            --entrypoint php \
            dolibarr-tls:ci \
            -l /var/www/html/core/db/mysqli.class.php

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dolibarr-tls:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dolibarr-tls:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          
      - name: Sign in to Azure with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/azure-terraform'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push tested image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/azure-terraform'
        run: |
          az acr login --name dolibaracr2026 --output none

          image="dolibaracr2026.azurecr.io/dolibarr-tls:sha-${GITHUB_SHA}"

          docker tag dolibarr-tls:ci "$image"
          docker push "$image"

          echo "Published image: $image"

      - name: Deploy image to App Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/azure-terraform'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          image="dolibaracr2026.azurecr.io/dolibarr-tls:sha-${GITHUB_SHA}"

          config_url="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/dolibarr-rg/providers/Microsoft.Web/sites/dolibarr-application/config/web?api-version=2025-03-01"

          body=$(jq -n --arg image "DOCKER|${image}" \
            '{properties: {linuxFxVersion: $image}}')

          az rest \
            --method patch \
            --url "$config_url" \
            --body "$body" \
            --output none

          echo "Requested App Service deployment: $image"